kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: chatapp-ingress
  namespace: chat-app
  labels:
    app: chatapp-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    -  http:
        paths:    
        - path: /
          pathType: Prefix
          backend:
            service:
              name:  frontend
              port:
                number: 80
        - path: /api
          pathType: Prefix
          backend:
            service:
              name:  backend
              port:
                number: 5001
        - path: /socket.io
          pathType: Prefix
          backend:
            service:
              name:  backend
              port:
                number: 5001